<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact - Qafotel</title><style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Quicksand:wght@400;500;600&display=swap');:root { --primary: #55632B; --background: #FDF8DD; --text: #333; --white: #ffffff; --accent: #8A9A5B; } body { margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; background-color: var(--background); color: var(--text); } header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background-color: var(--white); border-bottom: 2px solid var(--primary); } .logo { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--primary); font-weight: bold; } nav a { margin-left: 20px; text-decoration: none; color: var(--text); font-weight: 500; } .contact-container { max-width: 1000px; margin: 60px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; } .contact-info { background: var(--primary); color: var(--white); padding: 40px; border-radius: 30px 0 30px 0; } .contact-info h1 { font-family: 'Playfair Display', serif; margin-bottom: 30px; } .info-item { margin-bottom: 25px; display: flex; align-items: center; gap: 15px; } .info-item i { font-size: 20px; } .contact-form-card { background: var(--white); padding: 40px; border-radius: 0 30px 0 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); } .form-group { margin-bottom: 20px; } label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary); } input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; box-sizing: border-box; } input:focus, textarea:focus { outline: none; border-color: var(--primary); } .btn-submit { background-color: var(--primary); color: var(--white); border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-weight: 600; width: 100%; transition: background 0.3s; } .btn-submit:hover { background-color: var(--accent); } .leaf-icon { width: 40px; height: 40px; fill: var(--white); margin-bottom: 20px; } .social-links { margin-top: 40px; display: flex; gap: 15px; } .social-circle { width: 35px; height: 35px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; } footer { text-align: center; padding: 40px; border-top: 1px solid #eee; margin-top: 60px; font-size: 14px; color: #777; }</style></head><body><header><div class="logo">Qafotel</div><nav><a href="#">Home</a><a href="#">Rooms</a><a href="#">Café</a><a href="#">Gallery</a><a href="#" style="color: var(--primary); font-weight: bold;">Contact</a></nav></header><main><section class="contact-container"><div class="contact-info"><svg class="leaf-icon" viewBox="0 0 24 24"><path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/></svg><h1>Get in Touch</h1><p>Whether you're booking a stay or planning a botanical event, we're here to help.</p><div class="info-item"><span>📍</span><div><strong>Address</strong><br>Jl. Botanical Green No. 12, Bandung</div></div><div class="info-item"><span>📞</span><div><strong>Phone</strong><br>+62 22 1234 5678</div></div><div class="info-item"><span>✉️</span><div><strong>Email</strong><br>hello@qafotel.com</div></div><div class="social-links"><div class="social-circle">IG</div><div class="social-circle">FB</div><div class="social-circle">TW</div></div></div><div class="contact-form-card"><form><div class="form-group"><label>Full Name</label><input type="text" placeholder="Enter your name" required></div><div class="form-group"><label>Email Address</label><input type="email" placeholder="yourname@email.com" required></div><div class="form-group"><label>Inquiry Type</label><select required><option value="">Select a category</option><option value="room">Room Reservation</option><option value="cafe">Café Event / Table Booking</option><option value="other">General Inquiry</option></select></div><div class="form-group"><label>Message</label><textarea rows="5" placeholder="How can we help you?" required></textarea></div><button type="submit" class="btn-submit">Send Message</button></form></div></section></main><footer>&copy; 2023 Qafotel Hotel & Jardin Coffee. All rights reserved.</footer></body></html>
